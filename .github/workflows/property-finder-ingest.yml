name: Property Finder — refresh listings

# Fetches for-sale listings (RentCast, or the SimplyRETS demo feed when no key
# is set), flags waterfront homes against OpenStreetMap water, sends Discord
# alerts for saved searches, commits the snapshot the page reads, and
# redeploys the site. See scripts/property-finder/ingest.ts.

on:
  schedule:
    # Mon and Thu, ~7:20am Pacific (cron is UTC). Twice a week keeps a
    # Seattle-sized fetch inside RentCast's free 50 calls/month.
    - cron: '23 14 * * 1,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of sending them, and don't commit"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: property-finder-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Test
        run: npm test

      - name: Water geometry cache
        uses: actions/cache@v4
        with:
          path: .cache/property-finder
          # The newest water geometry is reused if Overpass is down during a run.
          key: pf-water-${{ github.run_id }}
          restore-keys: pf-water-

      - name: Fetch listings
        id: ingest
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          PF_DISCORD_WEBHOOK_URL: ${{ secrets.PF_DISCORD_WEBHOOK_URL }}
          PF_RAW_DIR: ${{ runner.temp }}/pf-raw
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npm run pf:ingest -- "${args[@]}"

      - name: Keep raw API payloads
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pf-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/pf-raw
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit snapshot
        # Runs after a failed fetch too, so the page shows the error and the
        # budget counter is saved. Committing also keeps the schedule alive
        # (GitHub pauses schedules after 60 days without repo activity).
        id: commit
        if: ${{ (success() || failure()) && inputs.dry_run != true }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain public/property-finder/data)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/property-finder/data
          git commit -m "Property Finder: refresh listings [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH" && echo "pushed=true" >> "$GITHUB_OUTPUT" && exit 0
            echo "Push attempt $attempt failed; retrying…"
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the snapshot. If main is protected, allow github-actions[bot] to push."
          exit 1

      - name: Redeploy the site
        # Pushes made with GITHUB_TOKEN don't trigger other workflows, but a dispatch does.
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run deploy.yml --ref "$BRANCH"
